# Render Blueprint. Nothing is deployed until you create a Blueprint from this repo in the
# Render dashboard (New > Blueprint). Plans below are the smallest paid/free tiers; change as needed.
services:
  - type: web
    name: resource-scheduling
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scheduling-db
          property: connectionString
      - key: MAX_TIME_LIMIT_S
        value: "60"

databases:
  - name: scheduling-db
    plan: free
    databaseName: scheduler
    user: scheduler
