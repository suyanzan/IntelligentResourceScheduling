name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scheduler:scheduler@localhost:5432/scheduler_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | grep -qi "<title>"
          curl -fsS -X POST http://localhost:8000/api/data/generate \
            -H 'Content-Type: application/json' -d '{"preset":"tiny"}' | grep -q '"id"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
